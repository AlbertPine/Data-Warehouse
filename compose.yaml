name: tmall-warehouse
services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.36.3@sha256:d426d2f612e1e189c90f9a3f8dcd85a03c6851273833817a296bb327e63aa7a7
    environment:
      CLICKHOUSE_USER: warehouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set in .env}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports:
      - "127.0.0.1:18123:8123"
    volumes:
      - warehouse-data:/var/lib/clickhouse
    mem_limit: 4g
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user warehouse --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 5s
      timeout: 4s
      retries: 15
volumes:
  warehouse-data:
