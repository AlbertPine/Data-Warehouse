services:
  airflow:
    image: apache/airflow:3.3.1@sha256:0c4bcc0370e526de1b7892a3bf4343d260c6c82359c66f77155b53cd773d6339
    command: standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__DAGS_FOLDER: /project/airflow
      AIRFLOW__CORE__DAGBAG_IMPORT_TIMEOUT: "60"
      AIRFLOW__CORE__PARALLELISM: "2"
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set in .env}
      TMALL_LOCK_DIR: /opt/airflow
    volumes:
      - ./airflow:/project/airflow:ro
      - ./warehouse.py:/project/warehouse.py:ro
      - ./sql:/project/sql:ro
      - ./source_manifest.json:/project/source_manifest.json:ro
      - type: bind
        source: ./天猫电商用户行为与复购数据
        target: /project/天猫电商用户行为与复购数据
        read_only: true
        bind:
          create_host_path: false
      - airflow-home:/opt/airflow
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:18080:8080"
    mem_limit: 1800m
volumes:
  airflow-home:
